signature swift-6.2.4-RELEASE-debian12-aarch64.tar.gz.sig - https://download.swift.org/swift-6.2.4-release/debian12-aarch64/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-debian12-aarch64.tar.gz.sig

