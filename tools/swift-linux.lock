# What `just setup-swift` installs on Linux (Debian 13, aarch64), pinned. The toolchain is the
# Debian 12 build: swift.org has no Debian 13 build of 6.2, and the Debian 12 one runs on newer glibc.
# tools/setup-swift.sh reads this file. Each line is:
#   <kind> <name> <sha256> <url>
# kind is one of:
#   toolchain  the Swift toolchain tarball
#   signature  the toolchain's detached signature (checked with gpgv when gpgv exists)
#   deb        a Debian package unpacked into the user-space sysroot
# signature has no pinned hash ("-"): gpgv checks it against tools/swift-keys.gpg, the
# "Swift 6.x Release Signing Key" (fingerprint 52BB 7E3D E28A 71BE 22EC 05FF EF80 A866 B47A 981F),
# dearmored from https://www.swift.org/keys/release-key-swift-6.x.asc and committed in the repo.
# The .debs come from snapshot.debian.org at a fixed date, so these URLs never vanish.
# To change a pin, edit this file: the next `just setup-swift` sees the new hash and rebuilds.

swift-version 6.2.4

