# Publishes a release when a tag like v0.2.0 is pushed. The tag is the only place the version is
# written: it must be vX.Y.Z and point at a commit on main. It builds the unsigned release on macOS
# (`just release-adhoc`) and attaches the .zip and its SHA-256 to a GitHub release. See
# docs/RELEASE.md.
#
# Actions are pinned by commit, with their tag in a comment; just is pinned and its checksum
# checked (.github/scripts/install-just.sh).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # Always GitHub's own runner: a release is never built on a personal or shared machine.
    # xcode-27 is the image whose default Xcode is 27, with Swift 6.4, which the build needs.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the number of commits
          persist-credentials: false
      - name: Install just (pinned, checksum verified)
        run: .github/scripts/install-just.sh

      - name: Take the version from the tag
        run: |
          version=$(tools/version.sh "$GITHUB_REF_NAME" 2>&1) || { echo "::error::$version"; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Check the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout keeps no credentials, so this fetch gets the token for this call only.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Releases are tagged on main only."
            exit 1
          fi

      - run: swift --version
      - name: Lint
        run: just lint
      - name: Test the scripts in tools/
        run: tools/test-tools.sh
      - name: Build the release (runs the core tests on this Swift too)
        run: just version="$VERSION" release-adhoc # the tag's version, whatever other tags say

      - name: Name the zip and record its checksum
        run: |
          mv build/HeadsUp.zip "build/HeadsUp-$VERSION.zip"
          (cd build && shasum -a 256 "HeadsUp-$VERSION.zip" >"HeadsUp-$VERSION.zip.sha256")
          cat "build/HeadsUp-$VERSION.zip.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/HeadsUp-$VERSION.zip" "build/HeadsUp-$VERSION.zip.sha256" \
            --verify-tag --title "HeadsUp $VERSION" --generate-notes

