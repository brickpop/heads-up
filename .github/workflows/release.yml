# Publishes a release when a tag like v0.2.0 is pushed. The tag must match `version` in the
# justfile and point at a commit on main. It builds the unsigned release on macOS
# (`just release-adhoc`), attaches the .dmg and its SHA-256 to a GitHub release, then updates the
# Homebrew cask in the tap. See docs/RELEASE.md.
#
# Settings, in the repository's Settings › Secrets and variables › Actions:
#   - variable HOMEBREW_TAP: the tap repository, e.g. brickpop/homebrew-tap. Unset: no cask update.
#   - secret HOMEBREW_TAP_TOKEN: a fine-grained token with Contents: read and write on that
#     repository only.
#
# Actions are pinned by commit, with their tag in a comment; just is pinned and its checksum
# checked (.github/scripts/install-just.sh).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # Always GitHub's own runner: a release is never built on a personal or shared machine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the number of commits
          persist-credentials: false
      - name: Use the newest Xcode toolchain on the runner
        run: .github/scripts/select-newest-xcode.sh
      - name: Install just (pinned, checksum verified)
        run: .github/scripts/install-just.sh

      - name: Check the tag matches the version
        run: |
          version=$(just print-version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the justfile's version is $version. Tag v$version, or change the version first."
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "BUNDLE_ID=$(just print-bundle-id)" >>"$GITHUB_ENV"

      - name: Check the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout keeps no credentials, so this fetch gets the token for this call only.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Releases are tagged on main only."
            exit 1
          fi

      - run: swift --version
      - name: Lint
        run: just lint
      - name: Test the scripts in tools/
        run: tools/test-tools.sh
      - name: Build the release (runs the core tests on this Swift too)
        run: just release-adhoc

      - name: Name the image and record its checksum
        run: |
          dmg="build/HeadsUp-$VERSION.dmg"
          mv build/HeadsUp.dmg "$dmg"
          (cd build && shasum -a 256 "HeadsUp-$VERSION.dmg" >"HeadsUp-$VERSION.dmg.sha256")
          echo "SHA256=$(cut -d' ' -f1 "$dmg.sha256")" >>"$GITHUB_ENV"
          cat "$dmg.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/HeadsUp-$VERSION.dmg" "build/HeadsUp-$VERSION.dmg.sha256" \
            --verify-tag --title "HeadsUp $VERSION" --generate-notes

      - name: Update the Homebrew cask
        if: ${{ vars.HOMEBREW_TAP != '' }}
        env:
          TAP: ${{ vars.HOMEBREW_TAP }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "::error::HOMEBREW_TAP is set but the HOMEBREW_TAP_TOKEN secret isn't."; exit 1; }
          tools/render-cask.sh "$VERSION" "$SHA256" "$GITHUB_REPOSITORY" "$BUNDLE_ID" >"$RUNNER_TEMP/headsup.rb"
          # The token goes in a header for these git calls only, never into a remote URL or a
          # file in the clone. Its base64 form is masked before it is used.
          basic=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          git -c "http.https://github.com/.extraheader=$auth" clone --depth 1 "https://github.com/$TAP.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp "$RUNNER_TEMP/headsup.rb" "$RUNNER_TEMP/tap/Casks/headsup.rb"
          cd "$RUNNER_TEMP/tap"
          if git diff --quiet -- Casks/headsup.rb && git ls-files --error-unmatch Casks/headsup.rb >/dev/null 2>&1; then
            echo "The cask is already at $VERSION."
            exit 0
          fi
          git add Casks/headsup.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "headsup $VERSION"
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD
